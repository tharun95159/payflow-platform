
spring.datasource.url=jdbc:postgresql://localhost:5432/account_test_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create
spring.datasource.hikari.connection-init-sql=DO $$ BEGIN IF current_database() <> 'account_test_db' THEN RAISE EXCEPTION 'Unsafe database for integration tests'; END IF; END $$
